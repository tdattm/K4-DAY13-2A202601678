alerts:
  - name: HighP95Latency
    severity: warning
    condition: "latency_p95_ms > 3000"
    duration: 5m
    type: symptom-based
    owner: member-d-sre
    runbook: docs/alerts.md#alert-1

  - name: HighRequestErrorRate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    owner: member-d-sre
    runbook: docs/alerts.md#alert-2

  - name: DailyCostBudgetExceeded
    severity: warning
    condition: "daily_cost_usd > 2.5"
    duration: 5m
    type: symptom-based
    owner: member-d-sre
    runbook: docs/alerts.md#alert-3
    