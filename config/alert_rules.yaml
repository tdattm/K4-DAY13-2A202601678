schema_version: 1
service: day13-observability-lab
defaults:
  owner: sre-alerts-engineer
  type: symptom-based
  no_data_state: no_data
  evaluation_interval: 1m

alerts:
  - name: HighP95Latency
    severity: warning
    sli: latency_p95_ms
    condition: "latency_p95_ms > 3000"
    operator: gt
    threshold: 3000
    evaluation_window: 5m
    duration: 5m
    minimum_requests: 20
    type: symptom-based
    owner: sre-alerts-engineer
    runbook: docs/alerts.md#alert-1-highp95latency
    summary: Users are waiting more than the 3-second P95 latency objective.
    recovery_condition: "latency_p95_ms <= 3000 for 10m"

  - name: HighRequestErrorRate
    severity: critical
    sli: error_rate_pct
    condition: "error_rate_pct > 2"
    operator: gt
    threshold: 2
    evaluation_window: 5m
    duration: 5m
    minimum_requests: 20
    type: symptom-based
    owner: sre-alerts-engineer
    runbook: docs/alerts.md#alert-2-highrequesterrorrate
    summary: More than 2% of user requests are failing.
    recovery_condition: "error_rate_pct <= 2 for 10m"

  - name: DailyCostBudgetExceeded
    severity: warning
    sli: daily_cost_usd
    condition: "daily_cost_usd > 2.5"
    operator: gt
    threshold: 2.5
    evaluation_window: 1d
    duration: 5m
    type: symptom-based
    owner: sre-alerts-engineer
    runbook: docs/alerts.md#alert-3-dailycostbudgetexceeded
    summary: Today's accumulated service cost has exceeded the 2.5 USD budget.
    recovery_condition: "cost_rate_usd_per_hour returns to baseline for 10m; keep the SLO violation recorded until the next day"

  - name: LowAverageQuality
    severity: warning
    sli: quality_score_avg
    condition: "quality_score_avg < 0.75"
    operator: lt
    threshold: 0.75
    evaluation_window: 5m
    duration: 10m
    minimum_requests: 20
    type: symptom-based
    owner: sre-alerts-engineer
    runbook: docs/alerts.md#alert-4-lowaveragequality
    summary: Users are receiving answers below the quality proxy objective.
    recovery_condition: "quality_score_avg >= 0.75 for 10m"
