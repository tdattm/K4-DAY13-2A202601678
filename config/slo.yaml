service: day13-observability-lab
window: 28d

slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    evaluation_window: 5m
    note: At least 99.5% of 5-minute windows must have P95 latency less than or equal to 3000 ms.

  error_rate_pct:
    objective: 2
    target: 99.0
    evaluation_window: 5m
    note: At least 99.0% of 5-minute windows must have an error rate less than or equal to 2%.

  daily_cost_usd:
    objective: 2.5
    target: 100.0
    evaluation_window: 1d
    note: Every evaluated day must have a total service cost less than or equal to 2.5 USD.

  quality_score_avg:
    objective: 0.75
    target: 95.0
    evaluation_window: 5m
    note: At least 95.0% of 5-minute windows must have an average quality score greater than or equal to 0.75.

    